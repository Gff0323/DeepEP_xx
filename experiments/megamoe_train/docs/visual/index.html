},{"line":50,"text":"    \"\"\"Fused Ascend950 BF16 forward/backward, derived from source b8cff148."},{"line":51,"text":""},{"line":52,"text":"    Select the NPU before construction. Pass an existing EP ProcessGroup or"},{"line":53,"text":"    StoreGroup. All ranks construct and close in the same order; DEEPEP_SHMEM_ENDPOINT names a separate bootstrap endpoint."},{"line":54,"text":"    This instance owns the root Session's symmetric window. There is one SHMEM"},{"line":55,"text":"    owner per process, shared with DeepEP's exclusion checks."},{"line":56,"text":""},{"line":57,"text":"    Calls use the construction stream and must be serialized in identical rank"},{"line":58,"text":"    order. Separate forwards retain separate saved tensors. Close only after"},{"line":59,"text":"    backward (or discard unused graphs). Higher-order derivatives, concurrent"},{"line":60,"text":"    streams, and simultaneous inference/communication owners are unsupported."},{"line":61,"text":"    \"\"\""},{"line":62,"text":""},{"line":63,"text":"    def __init__(self, ep_group, local_mem_size, *, timeout=120):"},{"line":64,"text":"        super().__init__()"}]}],"ordinal":1,"x":58,"y":112,"w":296,"h":124,"color":"python"},{"id":"m_runtime","lane":"resource","step":0,"title":"根 Runtime 管理所有权","subtitle":"deep_ep/_runtime.py","symbol":"Runtime / _TrainRuntime","description":["训练包装类选择根 Runtime 的训练工厂，检查各 rank 的配置和设备身份，并参与进程级 SHMEM 所有者互斥。它与 Host BF16Executor 的计算职责分离。"],"reads":["EP rank/world、窗口容量、endpoint"],"writes":["Runtime.native、进程所有者记录"],"waits":["EP 配置交换"],"sources":[{"path":"deep_ep/_runtime.py","anchor":"        if self._megamoe_train:","occurrence":1,"line":136,"start":134,"end":145,"sha256":"d7e4bd32957530d611684ff939e4f0c26b4bda22a043c0a58c7e3638717d04c7","url":"https://github.com/xixing-321/DeepEP/blob/1b2776cfe77f69f6b359d2031d6a847380b66e13/deep_ep/_runtime.py#L136","excerpt":[{"line":134,"text":"            rank, size = rank_and_world(group, rank, world_size)"},{"line":135,"te "},{"line":42,"text":"    const std::size_t context_bytes = static_cast\u003cstd::size_t>(context.numel()) * context.element_size();"},{"line":43,"text":"    TORCH_CHECK(context_bytes >= sizeof(MegaMoeContext), \"MegaMoe BF16 context tensor is too small\");"},{"line":44,"text":"    TORCH_CHECK(world_size \u003c= 1024, \"MegaMoe BF16 supports at most 1024 EP ranks\");"},{"line":45,"text":"    MegaMoeContext host_context{};"},{"line":46,"text":"    host_context.ep_rank_id = static_cast\u003cuint32_t>(rank);"},{"line":47,"text":"    host_context.rank_size_per_server = static_cast\u003cuint32_t>(world_size);"},{"line":48,"text":"    for (int peer = 0; peer \u003c world_size; ++peer) {"},{"line":49,"text":"        void* peer_ptr = aclshmem_ptr(symmetric_buffer, peer);"},{"line":50,"text":"        TORCH_CHECK(peer_ptr != nullptr, \"aclshmem_ptr failed for MegaMoe BF16 peer rank \", peer);"},{"line":51,"text":"        host_context.ep_buffer[peer] = reinterpret_cast\u003cuint64_t>(peer_ptr);"},{"line":52,"text":"    }"},{"line":53,"text":"    const auto copy_status ="},{"line":54,"text":"        aclrtMemcpy(context.data_ptr(), context_bytes, &host_context, sizeof(host_context), ACL_MEMCPY_HOST_TO_DEVICE);"},{"line":55,"text":"    TORCH_CHECK(copy_status == ACL_SUCCESS, \"failed to initialize MegaMoe BF16 communication context, acl error \","},{"line":56,"text":"                copy_status);"},{"line":57,"text":"}"}]}],"ordinal":3,"x":806,"y":460,"w":296,"h":124,"color":"host"},{"id":"lc_forward","lane":"python","step":3,"title":"提交一次前向","subtitle":"返回 y/counts 与内部持久状态","symbol":"_MegaMoeBF16TrainFunction.forward","description":["自定义 Function 调用执行器前向。设备写入 Y、counts、saved_state、dispatch_output；前向函数返回 Tensor 句柄，设备执行与后续依赖沿同一 stream 排序，不把 Host 函数返回等同为设备全局完成。"],"reads":["X、IDs、p、W1、W2","接收容量、保存模式"],"writes":["y、counts、每次调用的状态Tensor"],"waits":["Module仍存活且当前stream一致"],"sources":[{"path":"experiments/megamoe_train/python/deep_ep_experimental/megamoe_train/bf16.py","anchor":"    def f 1b5ef3","url":"https://github.com/xixing-321/DeepEP/blob/1b2776cfe77f69f6b359d2031d6a847380b66e13/experiments/megamoe_train/python/deep_ep_experimental/megamoe_train/bf16.py#L24","excerpt":[{"line":22,"text":"        ctx.op = op"},{"line":23,"text":"        ctx.max_recv, ctx.limit, ctx.mode = max_recv, limit, mode"},{"line":24,"text":"        ctx.save_for_backward(weights, w1, w2, result.counts, result.saved_state, result.dispatch_output)"},{"line":25,"text":"        ctx.mark_non_differentiable(result.counts)"},{"line":26,"text":"        return result.y, result.counts"},{"line":27,"text":""}]}],"ordinal":5,"x":58,"y":808,"w":296,"h":124,"color":"python"},{"id":"lc_scratch","lane":"host","step":5,"title":"临时 workspace 按 stream 保活","subtitle":"不用把临时区留在 autograd 图","symbol":"c10_npu::NPUCachingAllocator::recordStream","description":["前向临时激活和ready区只需要活到本次设备调用结束，Host 对参与异步执行的Tensor记录当前stream，避免分配器过早复用。反向另分配自己的scratch；这与保存到ctx的跨前后向状态是两种生命周期。"],"reads":["当前stream、参与调用的Tensor"],"writes":["分配器stream使用记录"],"waits":[],"sources":[{"path":"experiments/megamoe_train/csrc/bf16/training.cpp","anchor":"    return {y, expertTokenNums, trainingSavedState, dispatchOutput};","occurrence":1,"line":283,"start":275,"end":284,"sha256":"356bf75658ac5727df55fccbc78960dbe98789eb5b20bc31c37aca9e428c2920","url":"https://github.com/xixing-321/DeepEP/blob/1b2776cfe77f69f6b359d2031d6a847380b66e13/experiments/megamoe_train/csrc/bf16/training.cpp#L283","excerpt":[{"line":275,"text":"        forwardTransientWorkspace, tiling,"},{"line":276,"text":"        static_cast\u003cuint32_t>(platform_ascendc::PlatformAscendCManager::GetInstance()->GetCoreNumAic()),"},{"line":277,"text":"        symmetricBuffer, symmetricBufferBytes, rank, worldSize, ffts_addr);"},{"line":278,"text":"    const auto stream = c10_npu::getCurrentNPUStream();"},{"line":279,"text":"    for (const auto* tensor : {&context, &x, &topkIds, &topkWeights, &weight1, &weight2, &y, &expertTokenNums,"},{"line":280,"text":"                               &trainingSavedState, &dispatchOutput, &forwardTransientWorkspace}) {"},{"line":281,"text":"        c10_npu::NPUCachingAllocator::recordStream(tensor->storage().data_ptr(), stream);"},{"line":282,"text":"    }"},{"line":283,"text":"    return {y, expertTokenNums, trainingSavedState, dispatchOutput};"},{"line":284,"text":"}"}]}],"ordinal":6,"x":806,"y":982,"w":296,"h":124,"color":"host"},{"id":"lc_backward","lane":"python","step":6,"title":"autograd 提交对应反向","subtitle":"取回本次ctx的保存数据","symbol":"_MegaMoeBF16TrainFunction.backward","description":["自动求导传入grad_y，Function取出对应ctx的保存Tensor并调用执行器。四项梯度分别对应X、p、W1、W2；counts和整数IDs不求导。本实现使用once_differentiable，图内这里是一次反向边界。"],"reads":["grad_y、ctx.saved_tensors"],"writes":["dx、dtopk_weights、dw1、dw2"],"waits":["同一Module、同一stream"],"sources":[{"path":"experiments/megamoe_train/python/deep_ep_experimental/megamoe_train/bf16.py","anchor":"    def backward(ctx, grad_y, grad_counts=None):","occurrence":1,"line":30,"start":28,"end":48,"sha256":"4807693f6140c9d150661b87d5c176ab44c19726808785fd6fe17769351b5ef3","url":"https://github.com/xixing-321/DeepEP/blob/1b2776cfe77f69f6b359d2031d6a847380b66e13/experiments/megamoe_train/python/deep_ep_experimental/megamoe_train/bf16.py#L30","excerpt":[{"line":28,"text":"    @staticmethod"},{"line":29,"text":"    @once_differentiable"},{"line":30,"text":"    def backward(ctx, grad_y, grad_counts=None):"},{"line":31,"text":"        weights, w1, w2, counts, saved, dispatch = ctx.saved_tensors"},{"line":32,"text":"        op = ctx.op"},{"line":33,"text":"        op._check_ready()"},{"line":34,"text":"        result = op._executor.backward("},{"line":35,"text":"            grad_y.contiguous(),"},{"line":36,"text":"            weights,"},{"line":37,"text":"            w1,"},{"line":38,"text":"            w2,"},{"line":39,"text":"            counts,"},{"line":40,"text":"            saved,"},{"line":41,"text":"            dispatch,"},{"line":42,"text":"            ctx.max_recv,"},{"line":43,"text":" /W2、counts","saved_state、dispatch_output"],"writes":["反向shape与布局选择"],"waits":[],"sources":[{"path":"experiments/megamoe_train/csrc/bf16/training.cpp","anchor":"BackwardResult MegaMoeBF16Backward(","occurrence":1,"line":286,"start":284,"end":308,"sha256":"356bf75658ac5727df55fccbc78960dbe98789eb5b20bc31c37aca9e428c2920","url":"https://github.com/xixing-321/DeepEP/blob/1b2776cfe77f69f6b359d2031d6a847380b66e13/experiments/megamoe_train/csrc/bf16/training.cpp#L286","excerpt":[{"line":284,"text":"}"},{"line":285,"text":""},{"line":286,"text":"BackwardResult MegaMoeBF16Backward(torch::Tensor context, torch::Tensor gradY, torch::Tensor topkWeights,"},{"line":287,"text":"                                   torch::Tensor weight1, torch::Tensor weight2, torch::Tensor expertTokenNums,"},{"line":288,"text":"                                   torch::Tensor trainingSavedState, torch::Tensor dispatchOutput,"},{"line":289,"text":"                                   int64_t maxRecvTokens, int rank, int worldSize, std::size_t symmetricBufferBytes,"},{"line":290,"text":"                                   uint64_t ffts_addr, void* symmetricBuffer, double swigluLimit,"},{"line":291,"text":"                                   const std::string& save_gmm1_output)"},{"line":292,"text":"{"},{"line":293,"text":"    const int64_t m = gradY.size(0);"},{"line":294,"text":"    const int64_t k = gradY.size(1);"},{"line":295,"text":"    TORCH_CHECK(weight1.dim() == 3 && weight2.dim() == 3, \"weight1 and weight2 must be rank-3 tensors\");"},{"line":296,"text":"    const int64_t expertPerRank = weight1.size(0);"},{"line":297,"text":"    const auto weightLayout = ResolveBf16WeightLayout(weight1, weight2, k);"},{"line":298,"text":"    const int64_t n = weightLayout.n;"},{"line":299,"text":"    TORCH_CHECK(topkWeights.dim() == 2 && topkWeights.size(0) == m, \"topk_weights must have shape [m, topk]\");"},{"line":300,"text":"    const int64_t topk = topkWeights.size(1);"},{"line":301,"text":"    TORCH_CHECK(expertTokenNums.numel() == expertPerRank, \"expert_token_nums must have one entry per local expert\");"},{"line":302,"text":"    // Only persistent saved-state is consumed by backward."},{"line":303,"text":"    TORCH_CHECK(trainingSavedState.scalar_type() == torch::kUInt8 &&"},{"line":304,"text":"                    trainingSavedState.device().type() == c10::DeviceType::PrivateUse1,"},{"line":305,"text":"                \"training_saved_state must be an NPU UInt8 tensor\");"},{"line":306,"text":"    TORCH_CHECK(m > 0 && k > 0 && topk > 0 && expertPerRank > 0 && n > 0,"},{"line":307,"text":"                \"all MegaMoe BF16 backward dimensions must be positive\");"},{"line":308,"text":"    TORCH_CHECK(worldSize >= 2 && worldSize \u003c= static_cast\u003cint64_t>(MegaMoeBF16Training::kMaxEpRanks),"}]}],"ordinal":4,"x":432,"y":634,"w":296,"h":124,"color":"host"},{"id":"bc_layout","lane":"host","step":4,"title":"规划反向scratch与ready后缀","subtitle":"布局取决于保存模式与构建策略","symbol":"MegaMoeBF16BackwardWorkspaceLayout","description":["Host复用共享tiling规则、检查各阶段UB占用，再按保存模式和splitExperts计算scratch。默认FORCE_EXPERT_READY=OFF保留自动选择；统一整专家构建则令splitExperts=0。这里规划容量，并不表示所有输入已完成搬运。"],"reads":["tiling、savedMode、splitExperts","UB资源"],"writes":["反向workspace各区间大小"],"waits":[],"sources":[{"path":"experiments/megamoe_train/csrc/bf16/training.cpp","anchor":"struct MegaMoeBF16BackwardWorkspaceLayout {","occurrence":1,"line":132,"start":130,"end":153,"sha256":"356bf75658ac5727df55fccbc78960dbe98789eb5b20bc31c37aca9e428c2920","url":"https://github.com/xixing-321/DeepEP/blob/1b2776cfe77f69f6b359d2031d6a847380b66e13/experiments/megamoe_train/csrc/bf16/training.cpp#L132","excerpt":[{"line":130,"text":"}"},{"line":131,"text":""},{"line":132,"text":"struct MegaMoeBF16BackwardWorkspaceLayout {"},{"line":133,"text":"    std::size_t controlOffset;"},{"line":134,"text":"    std::size_t totalBytes;"},{"line":135,"text":""},{"line":136,"text":"    explicit MegaMoeBF16BackwardWorkspaceLayout(const MegaMoeTilingData& tiling, uint32_t splitExperts)"},{"line":137,"text":"    {"},{"line":138,"text":"        const std::size_t e = tiling.expertPerRank;"},{"line":139,"text":"        const std::size_t r = tiling.maxOutputSize;"},{"line":140,"text":"        const std::size_t k = tiling.k;"},{"line":141,"text":"        const std::size_t n = tiling.n;"},{"line":142,"text":"        const std::size_t f = n / 2;"},{"line":143,"text":"        const std::size_t dpPartialTiles = (f + BACKWARD_DP_PARTIAL_TILE_N - 1) / BACKWARD_DP_PARTIAL_TILE_N;"},{"line":144,"text":"        std::size_t offset = 0;"},{"line":145,"text":"        offset += Bf16Align(2 * r * k, 512);"},{"line":146,"text":"        const uint32_t savedMode ="},{"line":147,"text":"            MegaMoeBF16Training::ResolveSavedGateUpMode(tiling.savedGateUpMode, tiling.swigluLimit);"},{"line":148,"text":"        if (savedMode == MegaMoeBF16Training::kSaveNone) {"},{"line":149,"text":"            offset += Bf16Align(2 * r * f, 512);"},{"line":150,"text":"            offset += Bf16Align(2 * r * f, 512);"},{"line":151,"text":"        }"},{"line":152,"text":"        offset += Bf16Align(2 * r * n, 512);"},{"line":153,"text":"        offset += Bf16Align(2 * r * f, 512);"}]},{"path":"experiments/megamoe_train/csrc/bf16/training.cpp","anchor":"    const MegaMoeBF16BackwardWorkspaceLayout backwardLayout(tiling, splitExperts);","occurrence":1,"line":414,"start":411,"end":417,"sha256":"356bf75658ac5727df55fccbc78960dbe98789eb5b20bc31c37aca9e428c2920","url":"https://github.com/xixing-321/DeepEP/blob/1b2776cfe77f69f6b359d2031d6a847380b66e13/experiments/megamoe_train/csrc/bf16/training.cpp#L414","excerpt":[{"line":411,"text":"    }"},{"line":412,"text":"    if (!MegaMoeBF16Training::BackwardUsesGm(tiling.savedGateUpMode)) splitExperts = 0;"},{"line":413,"text":"#endif"},{"line":414,"text":"    const MegaMoeBF16BackwardWorkspaceLayout backwardLayout(tiling, splitExperts);"},{"line":415,"text":"    auto backwardWorkspace = AllocateBackwardWorkspace(backwar dy=\"0\">窗口可复用，保存张量由框架管理\u003c/tspan>\u003c/text>\u003ctext x=\"1838\" y=\"3010\" text-anchor=\"end\" font-size=\"10\" fill=\"#257b80\">m_window_exit\u003c/text>\u003c/g>\u003c/svg>","mermaid":"flowchart TB\n  subgraph lane_m_host[\"Host 容量 / 地址契约\"]\n    m_sizes[\"用容量 R 计算布局，用 M_e 执行任务\"]\n  end\n  subgraph lane_m_saved[\"前向持久 GM 张量\"]\n    m_dispatch_persist[\"独立 dispatch_output 保留 packed X/p\"]\n    m_saved_state[\"training_saved_state 保存数值与路由状态\"]\n  end\n  subgraph lane_m_scratch[\"调用临时 GM\"]\n    m_forward_transient[\"前向 Hp 与 ready flags 属于临时 GM\"]\n    m_backward_planes[\"反向按 R 预留 dO、dZ、Hp、partial\"]\n    m_dhp_alias[\"ptrHp 第一生命期：dHp GM 输出\"]\n    m_hp_overwrite[\"ptrHp 第二生命期：重建的前向 Hp\"]\n    m_dz_partials[\"dZ 与 dp partial 保持独立平面\"]\n    m_do_last_reader[\"先完成 dW2 对原始 dO 的读取\"]\n    m_dx_alias[\"ptrDX=ptrDO：切换为 dX 平面\"]\n  end\n  subgraph lane_m_ub[\"核内 UB 与完成信号\"]\n    m_fwd_ub[\"GMM1 的两块 UB 是 Gate 与 Up\"]\n    m_dispatch_buffers[\"token 与 p 使用不同 staging 事件\"]\n    m_ub_handoff[\"Dispatch 退出后 GMM2 才占 AIV1 UB\"]\n  end\n  subgraph lane_m_peer[\"SHMEM 通信窗口\"]\n    m_peer_input[\"SHMEM ptrA0 保存源端排序 payload\"]\n    m_return_dx[\"ptrD 在 P5 存 routed dX 矩阵\"]\n    m_ptrd_switch[\"P5所有读者完成后ptrD才能改用途\"]\n    m_ptrd_dp[\"P6复用ptrD开头存紧凑dp表\"]\n    m_window_exit[\"表清理和退出同步保护下一轮\"]\n  end\n  m_sizes --> m_dispatch_persist\n  m_sizes --> m_saved_state\n  m_sizes --> m_forward_transient\n  m_peer_input --> m_dispatch_persist\n  m_dispatch_persist --> m_fwd_ub\n  m_fwd_ub --> m_saved_state\n  m_fwd_ub --> m_forward_transient\n  m_dispatch_buffers -.-> m_ub_handoff\n  m_saved_state --> m_backward_planes\n  m_backward_planes --> m_dhp_alias\n  m_dhp_alias -.-> m_hp_overwrite\n  m_hp_overwrite --> m_dz_partials\n  m_hp_overwrite --> m_do_last_reader\n  m_do_last_reader -.-> m_dx_alias\n  m_dx_alias --> m_return_dx\n  m_return_dx -.-> m_ptrd_switch\n  m_ptrd_switch -.-> m_ptrd_dp\n  m_dz_partials --> m_ptrd_dp\n  m_ptrd_dp -.-> m_window_exit\n"}]}</script>
  <script>// Copyright (c) 2026, DeepEP contributors.
(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('reader-data').textContent);
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
  const groups = [ ['L1', '项目架构'], ['L2', '模块关系'], ['L3', '执行生命周期'], ['L4', '函数调用链'], ['L5', '核内与内存'] ];
  let graph, selected, scale = 1;
  const canvas = $('canvas'), viewport = $('viewport');
  $('repository').href = data.sourceRepository;
  $('revision').href = `${data.sourceRepository}/tree/${data.sourceCommit}`;
  $('revision').textContent = `源码 ${data.sourceCommit.slice(0, 7)}`;
  $('navigation').innerHTML = groups.map(([layer, title]) => `<div class="nav-group"><span class="nav-label">${layer} · ${title}</span>${data.graphs.filter(g => g.layer === layer).map(g => `<button type="button" data-view="${g.id}">${esc(g.title)}</button>`).join('')}</div>`).join('');
  function setScale(value) {
    scale = Math.max(.55, Math.min(1.75, value));
    const svg = canvas.querySelector('svg');
    svg.style.width = `${graph.width * scale}px`;
    svg.style.height = `${graph.height * scale}px`;
    $('zoom-label').textContent = `${Math.round(scale * 100)}%`;
  }
  function fit() { setScale(Math.min(1, (viewport.clientWidth - 18) / graph.width)); }
  function updateHash() { history.replaceState(null, '', `#view=${graph.id}&node=${selected.id}`); }
  function localFile(source) {
    if (location.protocol !== 'file:') return '';
    return new URL(`../../../../${source.path}`, location.href).href;
  }
  function editorFile(source) {
    const local = localFile(source);
    if (!local) return '';
    const file = new URL(local);
    const fullPath = decodeURIComponent(file.pathname).replace(/^\/([A-Za-z]:\/)/, '$1');
    return `vscode://file/${fullPath}:${source.line}`;
  }
  function details(node) {
    const lane = graph.lanes.find(l => l.id === node.lane);
    const list = [['读', node.reads], ['写', node.writes], ['等', node.waits]];
    const sourceBlocks = node.sources.map((source, index) => `<details class="source-block" ${index === 0 ? 'open' : ''}><summary>${esc(source.path.split('/').at(-1))}:${source.line}</summary><div class="source-links"><a target="_blank" rel="noopener" href="${esc(source.url)}">在线源码 ↗</a>${localFile(source) ? `<a href="${esc(localFile(source))}" target="_blank" rel="noopener">本地文件</a><a href="${esc(editorFile(source))}">编辑器定位</a>` : ''}</div><div class="source-path">${esc(source.path)}</div><div class="code-lines">${source.excerpt.map(row => `<div class="code-line ${row.line === source.line ? 'anchor-line' : ''}"><span class="ln">${row.line}</span><code>${esc(row.text)}</code></div>`).join('')}</div></details>`).join('');
    return `<div class="detail-kicker"><span class="pill">${esc(lane.label)}</span><span>${node.ordinal} / ${graph.nodes.length}</span></div><h3>${esc(node.title)}</h3>${node.symbol ? `<code class="function-name">${esc(node.symbol)}</code>` : ''}${(node.description || []).map(p => `<p>${esc(p)}</p>`).join('')}<dl class="detail-list">${list.filter(([, values]) => values?.length).map(([title, values]) => `<div><dt>${title}</dt><dd>${values.map(esc).join('<br>')}</dd></div>`).join('')}</dl>${node.formula ? `<pre class="formula">${esc(node.formula)}</pre>` : ''}${node.drilldown ? `<button type="button" class="drilldown" data-drill-view="${esc(node.drilldown.view)}" data-drill-node="${esc(node.drilldown.node || '')}">继续深入 → ${esc(data.graphs.find(g => g.id === node.drilldown.view).title)}</button>` : ''}<div class="detail-nav"><button type="button" id="previous" ${node.ordinal === 1 ? 'disabled' : ''}>← 上一步</button><button type="button" id="next" ${node.ordinal === graph.nodes.length ? 'disabled' : ''}>下一步 →</button></div><div class="sources-title">对应源码</div>${sourceBlocks}`;
  }
  function select(id, scroll = false) {
    selected = graph.nodes.find(n => n.id === id) || graph.nodes[0];
    for (const node of canvas.querySelectorAll('[data-node]')) node.classList.toggle('selected', node.dataset.node === selected.id);
    for (const edge of canvas.querySelectorAll('.edge')) {
      const related = edge.dataset.from === selected.id || edge.dataset.to === selected.id;
      edge.classList.toggle('related', related);
      edge.classList.toggle('dimmed', !related);
    }
    $('inspector').innerHTML = details(selected);
    $('previous').onclick = () => select(graph.nodes[selected.ordinal - 2]?.id, true);
    $('next').onclick = () => select(graph.nodes[selected.ordinal]?.id, true);
    $('inspector').querySelector('[data-drill-view]')?.addEventListener('click', event => {
      showView(event.currentTarget.dataset.drillView, event.currentTarget.dataset.drillNode);
    });
    if (scroll) {
      const x = (selected.x + selected.w / 2) * scale - viewport.clientWidth / 2;
      const y = selected.y * scale - 65;
      viewport.scrollTo({ left: Math.max(0, x), top: Math.max(0, y), behavior: 'smooth' });
    }
    updateHash();
  }
  function search() {
    const q = $('query').value.trim().toLowerCase();
    let matched = 0;
    for (const node of graph.nodes) {
      const text = JSON.stringify([node.title, node.symbol, node.description, node.reads, node.writes, node.waits]).toLowerCase();
      const visible = !q || text.includes(q);
      canvas.querySelector(`[data-node="${node.id}"]`).classList.toggle('muted', !visible);
      if (visible) ++matched;
    }
    $('search-status').textContent = q ? `找到 ${matched} / ${graph.nodes.length} 个节点` : '点击节点查看说明和源码';
  }
  function showView(id, node) {
    graph = data.graphs.find(g => g.id === id) || data.graphs[0];
    $('view-title').textContent = graph.title;
    $('view-layer').textContent = `${graph.layer} · ${groups.find(([key]) => key === graph.layer)[1]}`;
    $('view-summary').textContent = graph.summary;
    $('node-count').textContent = `${graph.nodes.length} 个节点`;
    for (const button of $('navigation').querySelectorAll('[data-view]')) {
      const active = button.dataset.view === graph.id;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', String(active));
    }
    canvas.innerHTML = graph.svg;
    viewport.scrollTo(0, 0);
    $('query').value = '';
    fit(); search(); select(node);
    for (const element of canvas.querySelectorAll('[data-node]')) {
      element.onclick = () => select(element.dataset.node);
      element.onkeydown = event => { if (['Enter', ' '].includes(event.key)) { event.preventDefault(); select(element.dataset.node); } };
    }
  }
  function download(content, type, name) {
    const url = URL.createObjectURL(new Blob([content], { type }));
    const anchor = document.createElement('a'); anchor.href = url; anchor.download = name; anchor.click();
    setTimeout(() => URL.revokeObjectURL(url), 500);
  }
  for (const button of $('navigation').querySelectorAll('[data-view]')) button.onclick = () => showView(button.dataset.view);
  $('fit').onclick = fit;
  $('zoom-in').onclick = () => setScale(scale + .1);
  $('zoom-out').onclick = () => setScale(scale - .1);
  $('query').oninput = search;
  $('show-sync').onchange = () => viewport.classList.toggle('hide-sync', !$('show-sync').checked);
  $('expand').onclick = () => { const expanded = viewport.classList.toggle('expanded'); $('expand').setAttribute('aria-pressed', String(expanded)); $('expand').textContent = expanded ? '收起整图' : '展开整图'; };
  $('svg-download').onclick = () => download(graph.svg, 'image/svg+xml', `${graph.id}.svg`);
  $('mmd-download').onclick = () => download(graph.mermaid, 'text/plain', `${graph.id}.mmd`);
  document.addEventListener('keydown', event => {
    if (event.target.matches('input,textarea')) return;
    if (event.key === 'ArrowRight' && selected.ordinal < graph.nodes.length) { event.preventDefault(); select(graph.nodes[selected.ordinal].id, true); }
    if (event.key === 'ArrowLeft' && selected.ordinal > 1) { event.preventDefault(); select(graph.nodes[selected.ordinal - 2].id, true); }
  });
  new ResizeObserver(() => { if (graph) fit(); }).observe(viewport);
  const state = new URLSearchParams(location.hash.slice(1));
  showView(state.get('view'), state.get('node'));
  window.__reader = { data, graph: () => graph, selected: () => selected, showView, select };
})();
</script>
